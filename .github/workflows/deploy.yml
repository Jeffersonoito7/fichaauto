name: Deploy Ficha Auto

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTGATOR_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOSTGATOR_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ secrets.HOSTGATOR_USER }}@${{ secrets.HOSTGATOR_HOST }} << 'ENDSSH'
            set -e
            cd /var/www/ficha-auto
            git pull origin main
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            npm ci --production=false
            npm run build
            pm2 restart ficha-auto
            echo "Deploy concluido: $(date)"
          ENDSSH
